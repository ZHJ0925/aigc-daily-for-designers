<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIGC 设计日报</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
  html,body{margin:0;min-height:100%;background:#070707;color:#DEDFEE;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  p{font-size:14px;opacity:.85}
  a{color:#8A35FF}
</style>
<script>
(function () {
  function shanghaiYMD(offsetDays) {
    var now = new Date();
    if (offsetDays) now = new Date(now.getTime() - offsetDays * 86400000);
    var parts = {};
    new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Shanghai",
      year: "numeric", month: "numeric", day: "numeric"
    }).formatToParts(now).forEach(function (p) { parts[p.type] = p.value; });
    return { y: +parts.year, m: +parts.month, d: +parts.day };
  }
  function hrefFor(p) {
    return p.y + "." + p.m + "." + p.d + "日报.html";
  }
  function tryUrl(url) {
    return fetch(url, { method: "GET", cache: "no-store" }).then(function (r) {
      return r.ok;
    }).catch(function () { return false; });
  }
  async function go() {
    var msg = document.getElementById("msg");
    for (var i = 0; i < 14; i++) {
      var p = shanghaiYMD(i);
      // rebuild with calendar arithmetic in Shanghai by stepping from "today" parts
      if (i > 0) {
        var base = shanghaiYMD(0);
        var dt = new Date(Date.UTC(base.y, base.m - 1, base.d));
        dt.setUTCDate(dt.getUTCDate() - i);
        p = { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate() };
      }
      var url = hrefFor(p);
      msg.textContent = i === 0 ? "正在打开今日日报…" : ("今日暂无，尝试 " + (p.m + "." + p.d) + "…");
      if (await tryUrl(url)) {
        location.replace(url);
        return;
      }
    }
    msg.innerHTML = '暂未找到可用日报。请稍后再试，或打开 <a href="2026.10.15日报.html">最近一期</a>。';
  }
  go();
})();
</script>
</head>
<body>
<main><p id="msg">正在打开今日日报…</p></main>
</body>
</html>
