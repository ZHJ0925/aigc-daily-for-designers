<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIGC 设计日报</title>
<meta http-equiv="refresh" content="0; url=2026.10.26.html">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
  html,body{margin:0;min-height:100%;background:#070707;color:#DEDFEE;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:12px}
  p{font-size:14px;opacity:.85;margin:0}
  a{color:#8A35FF}
  .fallback{display:none;margin-top:8px}
</style>
<script>
(function () {
  function shanghaiToday() {
    var parts = {};
    new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Shanghai",
      year: "numeric", month: "numeric", day: "numeric"
    }).formatToParts(new Date()).forEach(function (p) { parts[p.type] = p.value; });
    return { y: +parts.year, m: +parts.month, d: +parts.day };
  }
  function asciiHref(p) {
    return p.y + "." + p.m + "." + p.d + ".html";
  }
  function dayOffset(i) {
    var base = shanghaiToday();
    var dt = new Date(Date.UTC(base.y, base.m - 1, base.d));
    dt.setUTCDate(dt.getUTCDate() - i);
    return { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate() };
  }
  var today = shanghaiToday();
  // static default (baked at build time) = newest published report
  var STATIC_DEFAULT = "2026.10.26.html";
  var target = asciiHref(today);
  // weekend: go to the static default (newest report) instead of guessing Friday
  var wd = new Date(Date.UTC(today.y, today.m - 1, today.d)).getUTCDay();
  if (wd === 6 || wd === 0) target = STATIC_DEFAULT;
  var todayLink = document.getElementById("todayLink");
  if (todayLink) todayLink.href = target;
  try { location.replace(target); } catch (e) {}
  setTimeout(function () {
    var box = document.getElementById("fallback");
    var links = document.getElementById("links");
    if (!box || !links) return;
    box.style.display = "block";
    var html = "";
    for (var i = 0; i < 7; i++) {
      var p = dayOffset(i);
      var label = i === 0 ? ("今日 " + p.m + "." + p.d) : (p.m + "." + p.d);
      html += (i ? " · " : "") + '<a href="' + asciiHref(p) + '">' + label + "</a>";
    }
    links.innerHTML = html;
  }, 1500);
})();
</script>
</head>
<body>
<main>
  <p id="msg">正在打开今日日报…</p>
  <p><a id="todayLink" href="2026.10.26.html">点这里打开今日日报</a></p>
  <div id="fallback" class="fallback">
    <p>如果没有自动跳转，可点上面的链接，或选最近几天：</p>
    <p id="links"></p>
  </div>
</main>
</body>
</html>
